[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-mammouth"
version = "1.0.0"
description = "Assistant personnel basé sur Hermes 3 via l'API Mammouth AI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Francois Salazar", email = "francois.salazar@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "mistralai>=1.0.0",  # SDK OpenAI-compatible pour Mammouth AI
    "python-dotenv>=1.0.0",  # Gestion des variables d'environnement
    "rich>=13.0.0",  # Affichage coloré en terminal
]

[project.optional-dependencies]
api = [
    "flask>=3.0.0",  # Pour l'API web
]

[project.scripts]
hermes-agent = "src.main:main"  # Commande pour lancer l'agent

[project.gui-scripts]
hermes-agent = "src.main:main"  # Pour les IDE avec support GUI

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # Error, Future, Import, Warning
ignore = ["E501"]  # Ligne trop longue (géré par le linter)

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
